[project]
name = "framingo"
version = "0.0.1"
description = "Parser and grounding checker for Framingo, a formal language for models that separate logic from knowledge"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE-CODE"]
dependencies = []

[project.scripts]
framingo = "framingo.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framingo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
